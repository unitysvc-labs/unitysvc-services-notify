services:
  gateway:
    image: ghcr.io/kadxy/weixin-ilink-gateway@sha256:5436bf8f143538b3e539b959a4b15e3fecd4cfb0a6c2db680aa3e9566ec68b46
    ports:
      - 3000
    environment:
      API_KEY: ${UNITYSVC_INSTANCE_API_KEY}
      PORT: "3000"
      DATA_DIR: /tmp/weixin-ilink
      MAX_BUFFER_SIZE: "100"
      MAX_DOWNLOAD_SIZE_MB: "16"
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:3000/console >/dev/null"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 10s
