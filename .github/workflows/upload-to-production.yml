name: Upload Data to Production

# Production uploads run manually or after a pull request is merged.
# Assumes service IDs already exist in production (created by an earlier
# staging run; the services/**/service.json sidecars carry those IDs). This
# workflow therefore does NOT write service.json back to the repo — those
# are managed exclusively by the staging workflow.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

jobs:
  upload:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    uses: unitysvc-labs/.github/.github/workflows/seller-upload-production.yml@main
    secrets: inherit
    permissions:
      contents: write
